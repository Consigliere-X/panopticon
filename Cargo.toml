[package]
name = "panopticon"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
anyhow = "1.0.104"
aya = "0.14.0"
aes = "0.8"
base64 = "0.23.0"
cbc = "0.1"
bytes = "1.12.1"
crossterm = "0.29.0"
flate2 = "1.1.9"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
petgraph = "0.8.3"
pnet = "0.35.0"
publicsuffix = "2.3.0"
ratatui = "0.30.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1.53.1", features = ["full"] }
urlencoding = "2.1.3"
walkdir = "2.5.0"
